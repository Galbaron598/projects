apiVersion: v1
kind: ServiceAccount
metadata:
  name: etherealpod-controller
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: etherealpod-controller
rules:
  - apiGroups: ["example.com"]
    resources: ["etherealpods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["example.com"]
    resources: ["etherealpods/status"]
    verbs: ["get", "update", "patch"]

  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: etherealpod-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: etherealpod-controller
subjects:
  - kind: ServiceAccount
    name: etherealpod-controller
    namespace: default
