apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: etherealpods.example.com
spec:
  group: example.com
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                template:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: "Pod template spec"
              required:
                - template
            status:
              type: object
              properties:
                restarts:
                  type: integer
                  description: "Number of times the managed pod has restarted"
                podName:
                  type: string
                  description: "Name of the currently managed pod"
                phase:
                  type: string
                  description: "Current phase of the ethereal pod"
                message:
                  type: string
                  description: "Human-readable status message"
      additionalPrinterColumns:
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: Restarts
          type: integer
          jsonPath: .status.restarts
          description: "Number of pod restarts"
        - name: Phase
          type: string
          jsonPath: .status.phase
          description: "Controller status"
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: etherealpods
    singular: etherealpod
    kind: EtherealPod
    shortNames:
      - eps
