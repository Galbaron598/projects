# Medical Scheduling System - Docker Compose Configuration
# This file orchestrates all services: PostgreSQL, Auth Service, API Service, and Frontend

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: medical-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: medical_scheduling
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_secure_password}
      POSTGRES_INITDB_ARGS: "-A md5"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed_data.sql
    networks:
      - medical-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth Service (Port 8000)
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: medical-auth
    restart: unless-stopped
    environment:
      # Service Config
      PORT: 8000
      HOST: 0.0.0.0
      
      # JWT Configuration
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-secret-key-in-production}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: 1440
      
      # OTP Configuration
      OTP_EXPIRY_MINUTES: 5
      
      # CORS
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://frontend:3000
    ports:
      - "8000:8000"
    networks:
      - medical-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # API Service (Port 8001)
  api-service:
    build:
      context: ./api-service
      dockerfile: Dockerfile
    container_name: medical-api
    restart: unless-stopped
    environment:
      # Service Config
      PORT: 8001
      HOST: 0.0.0.0
      DEBUG: "False"
      
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: medical_scheduling
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-your_secure_password}
      DB_POOL_MIN_CONN: 5
      DB_POOL_MAX_CONN: 20
      
      # Auth Service
      AUTH_SERVICE_URL: http://auth-service:8000
      
      # JWT Configuration (must match auth-service)
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-secret-key-in-production}
      JWT_ALGORITHM: HS256
      
      # CORS
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://frontend:3000
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - medical-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Frontend (Port 3000)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_AUTH_SERVICE_URL: http://localhost:8000
        VITE_API_SERVICE_URL: http://localhost:8001
    container_name: medical-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - auth-service
      - api-service
    networks:
      - medical-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Docker Networks
networks:
  medical-network:
    driver: bridge
    name: medical-network

# Persistent Volumes
volumes:
  postgres_data:
    driver: local
    name: medical-postgres-data